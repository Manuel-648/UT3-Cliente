<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="panel">
    <h1>Tu web personalizada</h1>

    <!-- aquí el JS mete la bienvenida -->
    <div id="contenedor-bienvenida"></div>

    <!-- formulario -->
    <form>
      <div class="campo">
        <label for="nombre-usuario">Nombre de usuario</label>
        <input type="text" id="nombre-usuario">
      </div>

      <div class="campo">
        <label for="color-fondo">Color de fondo</label>
        <input type="color" id="color-fondo" value="#ffffff">
      </div>

      <div class="campo">
        <label for="tema-visual">Tema visual</label>
        <select id="tema-visual">
          <option value="claro">Modo Claro</option>
          <option value="oscuro">Modo Oscuro</option>
        </select>
      </div>

      <!-- botones -->
      <div class="botones">
        <button type="button" id="boton-guardar">Guardar Preferencias</button>
        <button type="button" id="boton-restablecer" class="secundario">Restablecer Interfaz</button>
      </div>
    </form>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
